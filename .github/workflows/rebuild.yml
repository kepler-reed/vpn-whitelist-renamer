name: rebuild subs.txt

on:
  schedule:
    - cron: "0 * * * *"      # каждый час
  workflow_dispatch:           # ручной запуск
  push:
    paths:
      - 'scripts/build.js'
      - '.github/workflows/rebuild.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate subs.txt
        run: node scripts/build.js
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain subs.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add subs.txt
            git commit -m "chore: regenerate subs.txt"
            git push
          else
            echo "subs.txt unchanged, skipping commit"
          fi
